<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Parking Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        html, body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;
        }

        #map {

            width: 100%;
            height: 100vh;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    // DEFAULT LOCATION

    var map = L.map('map').setView(
        [19.0760, 72.8777],
        11
    );

    // TILE LAYER

    L.tileLayer(

        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

        {
            attribution: '© OpenStreetMap'
        }

    ).addTo(map);

    // MARKERS ARRAY

    let parkingMarkers = [];

    // USER LOCATION

    if(navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(

            function(position) {

                let lat = position.coords.latitude;
                let lon = position.coords.longitude;

                // USER MARKER

                L.marker([lat, lon])

                    .addTo(map)

                    .bindPopup("You are here")

                    .openPopup();

                map.setView([lat, lon], 13);
            }
        );
    }

    // LOAD PARKING DATA

    function loadParkingData(data) {

        // REMOVE OLD MARKERS

        parkingMarkers.forEach(marker => {

            map.removeLayer(marker);
        });

        parkingMarkers = [];

        // LOOP PARKINGS

        data.forEach(parking => {

            let color =
                parking.available > 0
                ? "green"
                : "red";

            let marker = L.circleMarker(

                [parking.lat, parking.lon],

                {
                    color: color,
                    radius: 10,
                    fillOpacity: 0.8
                }

            ).addTo(map);

            marker.bindPopup(

                `
                <div style="width:200px">

                    <h3>${parking.name}</h3>

                    <p>
                        Available Slots:
                        ${parking.available}
                    </p>

                    <p>
                        Status:
                        <b style="color:${color}">
                            ${parking.available > 0
                                ? "Available"
                                : "Full"}
                        </b>
                    </p>

                    <button
                        onclick="bookSlot('${parking.id}')"

                        style="
                            width:100%;
                            padding:10px;
                            margin-top:10px;
                            background:green;
                            color:white;
                            border:none;
                            border-radius:8px;">

                        Book Slot
                    </button>

                    <button
                        onclick="navigateToParking(
                            ${parking.lat},
                            ${parking.lon}
                        )"

                        style="
                            width:100%;
                            padding:10px;
                            margin-top:10px;
                            background:blue;
                            color:white;
                            border:none;
                            border-radius:8px;">

                        Navigate
                    </button>

                </div>
                `
            );

            parkingMarkers.push(marker);
        });
    }

    // BOOK SLOT

    function bookSlot(parkingId) {

        Android.bookParking(parkingId);
    }

    // NAVIGATION

    function navigateToParking(lat, lon) {

        Android.navigateTo(lat, lon);
    }

    // SEARCH PARKING

    function searchParking(text) {

        parkingMarkers.forEach(marker => {

            let popupText =
                marker.getPopup().getContent();

            if(popupText
                .toLowerCase()
                .includes(text.toLowerCase())) {

                marker.addTo(map);
            }

            else {

                map.removeLayer(marker);
            }
        });
    }

</script>

</body>
</html>
